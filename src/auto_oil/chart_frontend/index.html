<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#242933;font:13px system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,select,input{font:inherit;color:inherit;background:#fff;border:1px solid #e7e9ee;border-radius:6px;min-height:36px;padding:5px 10px}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.35;cursor:default}button.active{color:#e74747;background:#fff2f2;border-color:transparent}button:focus-visible{outline:2px solid #ee6262}#app{height:var(--screen,640px);min-height:460px;display:flex;flex-direction:column;overflow:auto;max-width:760px;margin:auto}.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #f0f1f4}.top strong{font-size:18px}.top button{border:0;padding:5px 8px;font-size:13px}.top .version{font-size:10px;color:#9b9fa7;margin-left:5px}.summary{display:flex;padding:10px 12px;gap:16px;align-items:center;min-height:72px}.return{min-width:92px;border-right:1px solid #eee;padding-right:14px}.return strong{font-size:27px;font-weight:600;letter-spacing:-1px}.return small{display:block;color:#999;font-size:11px}.prices{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;font-variant-numeric:tabular-nums;flex:1}.prices span{display:flex;justify-content:space-between;gap:8px}.prices label{color:#999}.up{color:#e8464c}.down{color:#169d78}.bar{display:flex;gap:2px;align-items:center;border-bottom:1px solid #eff0f3;padding:0 7px;min-height:37px;flex-shrink:0}.bar button{border:0;border-radius:0;padding:5px 8px;white-space:nowrap}.bar .active{background:white;border-bottom:2px solid #e74747}.spacer{flex:1}.bar.scroll{overflow-x:auto;scrollbar-width:none}.bar.scroll::-webkit-scrollbar{display:none}#wrap{display:flex;flex-direction:column;flex:1;min-height:120px}.chartbox{flex:1;position:relative;min-height:62px}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}#quote{font-size:10px;padding:3px 10px;height:21px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}#subbar button{font-size:12px;padding:5px 10px}.zoom{position:absolute;right:64px;top:45%;display:flex;gap:4px}.zoom button{background:#ffffffdf;color:#828995;min-height:28px;min-width:28px;padding:2px 6px;border-radius:4px}.footer{position:sticky;bottom:0;z-index:2;flex-shrink:0;background:#fff;box-shadow:0 -2px 10px #26303a08;padding:6px 10px max(8px,env(safe-area-inset-bottom))}.positions{display:flex;justify-content:space-between;align-items:center;font-size:12px;height:24px}.positions button{font-size:12px;min-height:24px;padding:0;border:0;color:#777}.quantity{display:flex;align-items:center;gap:6px;height:40px}.quantity label{font-size:12px;color:#888;margin-right:3px}.quantity button{min-width:42px;min-height:30px}.quantity .order{margin-left:auto;font-size:12px}.trades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:3px 0 8px}.trades button{font-size:17px;font-weight:600;height:43px;border:0}.trades .red{background:#ed4d50;color:#fff}.trades .green{background:#16a17c;color:#fff}.trades .redlight{background:#fff0f0;color:#dc464a}.trades .greenlight{background:#eaf8f2;color:#168f70}.playback{display:flex;gap:6px;align-items:center}.playback button{height:36px;font-size:12px}.playback #next{flex:1;font-size:15px;background:#fff2e7;border:1px solid #ffdfc1;color:#cf762c;font-weight:600}.playback select{width:57px;padding:4px}.timeline{display:flex;justify-content:space-between;color:#9a9ea6;font-size:10px;padding:5px 1px 0}.progress{height:2px;background:#f4f4f4}.progress i{display:block;height:100%;background:#ef7779}.hidden{display:none!important}dialog{border:0;box-shadow:0 3px 30px #0002;border-radius:16px;padding:20px;color:#242933;width:440px;max-width:100%;max-height:85%;overflow:auto}dialog::backdrop{background:#18212f66}.fields{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center}.fields input{width:100%;min-width:0}.fields small{grid-column:1/-1;color:#999}.sheetbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheetbar h3{margin:0}dialog button{min-height:40px}.sheetoptions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}#error{color:#e44}#context{position:fixed;z-index:10;background:white;padding:7px;border:1px solid #ddd;display:none}#context button{display:block}#notice{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#242933ed;color:white;border-radius:10px;padding:12px 18px;max-width:88%;z-index:20;pointer-events:none;font-size:14px}#notice:empty{display:none}@media(max-width:650px){dialog{position:fixed;inset:auto 0 0;margin:0;width:100%;border-radius:18px 18px 0 0}.return strong{font-size:25px}.prices{gap:5px 12px}.top{padding:0 10px}}@media(max-height:690px){.summary{min-height:61px;padding:6px 10px}.top{height:42px}.footer{padding-top:2px}.trades button{height:39px}.bar{min-height:33px}}
.periods{justify-content:space-between}.periods button{flex:1;padding:4px 3px}.label{color:#9298a5;font-size:11px}.return{min-width:150px}.return strong{font-size:28px}.return small{line-height:1.5}#returns{font-size:13px}.top{flex-shrink:0}.summary{flex-shrink:0}.prices{font-size:12px;gap:4px 8px}.top strong{font-size:16px}.top button{font-size:12px;padding:5px}.bar button{padding:4px 7px}@media(max-width:360px){.return{min-width:128px}.return strong{font-size:24px}.summary{gap:8px}.prices{gap:4px}.top .version{margin-left:2px}}
</style></head><body><main id="app">
<header class="top"><div><strong>原油 K线训练</strong><span class="version">v5</span></div><div><button id="random" title="按设置随机重置，清空本次账户">随机换一局</button><button id="settings">时间设置</button></div></header>
<section class="summary"><div class="return"><small>本局净盈亏（元）</small><strong id="netpnl">0.00</strong><small id="returns">0.00%</small></div><div class="prices"><span><label>开</label><b id="qo">—</b></span><span><label>高</label><b id="qh">—</b></span><span><label>收</label><b id="qc">—</b></span><span><label>低</label><b id="ql">—</b></span></div></section>
<div class="bar periods"><button data-period="1">1分</button><button data-period="5">5分</button><button data-period="15">15分</button><button data-period="30">30分</button><button data-period="60">1小时</button><button data-period="1440">日线</button></div>
<div class="bar"><span class="label">主图</span><button data-main="MA">均线</button><button data-main="BOLL">布林线</button><button data-main="NONE">裸K</button><button data-main="EXPMA">EXPMA</button><span class="spacer"></span><button id="more">•••</button></div>
<div id="wrap"><div id="quote">加载行情…</div><div class="chartbox"><canvas id="chart" tabindex="0" aria-label="原油K线图，双指缩放，拖动平移，长按查看价格"></canvas><div class="zoom"><button id="zout" aria-label="缩小K线">−</button><button id="zin" aria-label="放大K线">＋</button><button id="latest">最新</button></div></div><div class="bar scroll" id="subbar"><button data-sub="MACD">MACD</button><button data-sub="KDJ">KDJ</button><button data-sub="RSI">RSI</button><button data-sub="WR">W&R</button><button data-sub="CCI">CCI</button><button data-sub="VOL">成交量</button></div></div>
<div class="progress"><i id="progress"></i></div>
<footer class="footer"><div class="positions"><span id="holdings">多 0手 · 空 0手</span><span id="pnl">浮盈 0.00</span><button id="records">账户 / 记录 ›</button></div><div class="quantity"><label>手数</label><button data-qty="1" class="active">1</button><button data-qty="2">2</button><button data-qty="3">3</button><button class="order" id="order">市价 ▾</button></div><div class="trades"><button class="red" id="open_long">开多</button><button class="green" id="open_short">开空</button><button class="redlight" id="close_long">平多</button><button class="greenlight" id="close_short">平空</button></div><div class="playback"><button id="play">▶ 播放</button><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select><button id="next">下一根 ›</button><button id="forward">快进10根</button></div><div class="timeline"><span id="time">—</span><span id="status">双指缩放 · 长按看价</span></div></footer></main>
<div id="notice" role="status"></div>
<dialog id="options"><div class="sheetbar"><h3>图表设置</h3><button onclick="this.closest('dialog').close()">关闭</button></div><div class="sheetoptions"><button id="params">指标参数</button><button id="style">空心阳线</button><button id="reset">恢复视图</button></div><div class="sheetoptions"><label><input type="checkbox" id="levels" checked>持仓 / 挂单线</label></div><p>双指缩放；单指拖动看历史；长按 K 线查看十字光标。点“最新”返回当前行情。</p><p id="history"></p><p id="view"></p><div class="hidden"><button id="older"></button><button id="newer"></button><button id="full"></button></div></dialog>
<dialog id="orderSheet"><div class="sheetbar"><h3>委托设置</h3><button onclick="this.closest('dialog').close()">关闭</button></div><div class="sheetoptions"><button id="marketMode">市价委托</button><button id="limitMode">限价委托</button></div><label>限价价格 <input type="number" id="limitValue" min="0.1" step="0.1" inputmode="decimal"></label><p>每笔最多 3 手。限价单从下一分钟起撮合；可在账户 / 记录中撤单。</p><button id="flatten">全部平仓并撤单</button></dialog>
<div id="context"><button data-action="latest">回到最新</button><button data-action="reset">恢复默认视图</button><button data-action="params">设置指标参数</button></div>
<dialog id="dialog"><form id="form"><h3>指标参数</h3><div class="fields"><label>MA</label><input name="ma" aria-label="MA周期"><label>BOLL</label><input name="boll" aria-label="BOLL周期和倍数"><label>EXPMA</label><input name="ema" aria-label="EXPMA周期"><label>MACD</label><input name="macd" aria-label="MACD参数"><label>KDJ</label><input name="kdj" aria-label="KDJ参数"><label>RSI</label><input name="rsi" aria-label="RSI周期"><label>W&R</label><input name="wr" aria-label="WR周期"><label>CCI</label><input name="cci" aria-label="CCI周期"><small>逗号分隔；周期 1–250。BOLL：周期,标准差倍数。MACD：短,长,信号。KDJ：周期,K平滑,D平滑。</small></div><p id="error"></p><button type="submit">应用</button> <button type="button" id="cancel">取消</button> <button type="button" id="defaultparams">默认参数</button></form></dialog>
<script src="indicators.js?v=5"></script><script src="terminal.js?v=5"></script><script src="mobile.js?v=5"></script></body></html>
