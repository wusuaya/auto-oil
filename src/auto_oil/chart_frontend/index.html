<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#c9cbd2;font:12px 'Microsoft YaHei',Arial,sans-serif}button,select,input{font:inherit;color:inherit;background:#1c1f26;border:1px solid #373b45;border-radius:2px;padding:5px 8px}button{cursor:pointer}button:hover,button.active{background:#333025;color:#ffd351;border-color:#8b7631}button:focus-visible{outline:1px solid #ffd351}.bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid #343740}.label{color:#838995;margin:0 4px}.spacer{flex:1}.info{min-height:26px;padding:6px 9px;color:#e8e8eb;border-bottom:1px solid #30333b;font-variant-numeric:tabular-nums}.help{color:#8e939f;padding:5px 8px;line-height:1.6;display:flex;justify-content:space-between;gap:10px}canvas{display:block;width:100%;height:460px;touch-action:none;outline:none;cursor:crosshair}#wrap{border:1px solid #353842}#wrap.large canvas{height:680px}#wrap:fullscreen{height:100vh}#wrap:fullscreen canvas{height:calc(100vh - 160px)}dialog{background:#1b1e25;color:#ddd;border:1px solid #666;max-width:95vw}dialog::backdrop{background:#0009}.fields{display:grid;grid-template-columns:100px 200px;gap:10px;align-items:center}.fields input{width:100%}.fields small{grid-column:1/-1;color:#989da8}#error{color:#ff727b;min-height:22px}.badge{color:#e6bb49}#context{position:fixed;z-index:10;background:#242832;padding:7px;border:1px solid #626570;display:none}#context button{display:block;width:100%;text-align:left;margin:3px 0}@media(max-width:650px){canvas{height:420px}.bar{gap:3px;padding:5px 4px}button{padding:6px}.help{font-size:11px}.fields{grid-template-columns:90px 170px}}
</style></head><body><div id="wrap">
<div class="bar" id="mainbar"><span class="label">主图</span><button data-main="MA">MA 均线</button><button data-main="BOLL">BOLL</button><button data-main="EXPMA">EXPMA</button><button data-main="NONE">裸 K</button><span class="spacer"></span><button id="params">指标参数</button><button id="style">空心阳线</button><button id="full">放大图表</button></div>
<div class="bar"><button id="zin" title="放大 K 线（↑ / +）">＋ 放大</button><button id="zout" title="缩小 K 线（↓ / −）">－ 缩小</button><button id="older">◀ 前移</button><button id="newer">后移 ▶</button><button id="latest">回到最新</button><button id="reset">恢复默认</button><span class="spacer"></span><span id="view" class="badge" role="status"></span></div>
<div id="quote" class="info" aria-live="off">加载行情…</div>
<canvas id="chart" tabindex="0" aria-label="原油K线图：滚轮缩放，拖动平移，上下键缩放，左右键移动十字光标，End回到最新"></canvas>
<div class="bar" id="subbar"><span class="label">副图</span><button data-sub="MACD">MACD</button><button data-sub="KDJ">KDJ</button><button data-sub="RSI">RSI</button><button data-sub="WR">W&R</button><button data-sub="CCI">CCI</button><button data-sub="VOL">仅成交量</button><span class="spacer"></span><label><input type="checkbox" id="vol" checked>成交量</label><label><input type="checkbox" id="levels" checked>持仓/挂单线</label></div>
<div class="help"><span>滚轮 / ↑↓ 缩放 · 拖动平移 · ←→ 十字光标 · End 最新 · 双击复位 · 手机双指缩放</span><span id="history"></span></div>
</div>
<div id="context"><button data-action="latest">回到最新</button><button data-action="reset">恢复默认视图</button><button data-action="params">设置指标参数</button></div>
<dialog id="dialog"><form id="form"><h3>指标参数</h3><div class="fields"><label>MA</label><input name="ma" aria-label="MA周期"><label>BOLL</label><input name="boll" aria-label="BOLL周期和倍数"><label>EXPMA</label><input name="ema" aria-label="EXPMA周期"><label>MACD</label><input name="macd" aria-label="MACD参数"><label>KDJ</label><input name="kdj" aria-label="KDJ参数"><label>RSI</label><input name="rsi" aria-label="RSI周期"><label>W&R</label><input name="wr" aria-label="WR周期"><label>CCI</label><input name="cci" aria-label="CCI周期"><small>逗号分隔；周期 1–250。BOLL：周期,标准差倍数。MACD：短,长,信号。KDJ：周期,K平滑,D平滑。</small></div><p id="error"></p><button type="submit">应用</button> <button type="button" id="cancel">取消</button> <button type="button" id="defaultparams">默认参数</button></form></dialog>
<script src="indicators.js"></script><script src="terminal.js"></script></body></html>
